[workspace]
resolver = "2"
members = [
    "crates/sdkwork-rpc-core",
    "crates/sdkwork-rpc-resilience",
    "crates/sdkwork-rpc-discovery",
    "crates/sdkwork-rpc-client",
    "crates/sdkwork-rpc-server",
    "tests/architecture",
]

[workspace.package]
rust-version = "1.85"
edition = "2021"
version = "0.1.0"
license = "AGPL-3.0-or-later"

[workspace.lints.rust]
# RUST_CODE_SPEC.md section 13 baseline.
# Deny-tier lints (unsafe_code, panic, unwrap_used, expect_used, pedantic) are
# promoted per crate together with their cleanup: enabling them fleet-wide
# today floods or fails builds that have not paid that debt yet.
unsafe_op_in_unsafe_fn = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"

[workspace.dependencies]
sdkwork_discovery_storage_memory = { path = "../sdkwork-discovery/crates/sdkwork-discovery-storage-memory", package = "sdkwork-discovery-storage-memory" }

sdkwork_discovery_core = { path = "../sdkwork-discovery/crates/sdkwork-discovery-core", package = "sdkwork-discovery-core" }

async-trait = "0.1"
sdkwork-rpc-core = { path = "crates/sdkwork-rpc-core" }
sdkwork-rpc-resilience = { path = "crates/sdkwork-rpc-resilience" }
sdkwork-rpc-discovery = { path = "crates/sdkwork-rpc-discovery" }
sdkwork-rpc-client = { path = "crates/sdkwork-rpc-client" }
sdkwork-rpc-server = { path = "crates/sdkwork-rpc-server" }
sdkwork-rpc-core-rust = { package = "sdkwork-rpc-core-rust", path = "../sdkwork-appbase/crates/sdkwork-rpc-core-rust" }
sdkwork-discovery-rpc-proto = { path = "../sdkwork-discovery/crates/sdkwork-discovery-rpc-proto" }
sdkwork-discovery-rpc = { path = "../sdkwork-discovery/crates/sdkwork-discovery-rpc" }
sdkwork_utils_rust = { package = "sdkwork-utils-rust", path = "../sdkwork-utils/packages/sdkwork-utils-rust" }
prost = "0.14"
prost-types = "0.14"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tonic = { version = "0.14.6", features = ["transport"] }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tokio-stream = "0.1"
tracing = "0.1"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4"] }
x509-parser = "0.18"
